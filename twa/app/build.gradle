plugins {
    id 'com.android.application'
}

def twaManifest = [
    applicationId: 'com.luxeglow.crm',
    name: 'Qvrix Luxe - Salon & Spa CRM',
    launcherName: 'Qvrix Luxe',
]

android {
    compileSdkVersion 36
    namespace "com.luxeglow.crm"

    buildFeatures {
        resValues true
        buildConfig true
    }

    // The URL is public configuration, not a credential. CI/release builds
    // set SPACRM_PRODUCTION_URL (or -PspacrmProductionUrl); source code never
    // embeds it in the Activity and no hosted SPA files are packaged here.
    def productionUrl = (project.findProperty('spacrmProductionUrl')
        ?: System.getenv('SPACRM_PRODUCTION_URL')
        ?: 'https://spacrm-ishari.vercel.app/').toString().trim()
    if (!(productionUrl ==~ /^https:\/\/.+/)) {
        throw new GradleException('SPACRM production URL must use HTTPS.')
    }

    defaultConfig {
        applicationId "com.luxeglow.crm"
        minSdkVersion 23
        targetSdkVersion 36
        versionCode 4
        versionName "1.0.3"

        resValue "string", "appName", twaManifest.name
        resValue "string", "launcherName", twaManifest.launcherName
        buildConfigField "String", "SPACRM_PRODUCTION_URL", "\"${productionUrl}\""
    }
    signingConfigs {
        release {
            storeFile file("${rootProject.projectDir}/keys/luxeglow-release.keystore")
            storePassword System.getenv('KEYSTORE_PASSWORD') ?: ''
            keyAlias 'luxeglow'
            keyPassword System.getenv('KEY_PASSWORD') ?: ''
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lintOptions {
        checkReleaseBuilds false
    }
}

repositories {

}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}
