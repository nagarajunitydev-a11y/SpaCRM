plugins {
    id 'com.android.application'
}

apply plugin: 'com.google.gms.google-services'

def twaManifest = [
    applicationId: 'com.luxeglow.crm',
    name: 'Qvrix Luxe - Salon & Spa CRM',
    launcherName: 'Qvrix Luxe',
]

android {
    compileSdkVersion 36
    namespace "com.luxeglow.crm"

    buildFeatures {
        resValues true
    }

    defaultConfig {
        applicationId "com.luxeglow.crm"
        minSdkVersion 23
        targetSdkVersion 36
        versionCode 4
        versionName "1.0.3"

        resValue "string", "appName", twaManifest.name
        resValue "string", "launcherName", twaManifest.launcherName
    }
    signingConfigs {
        release {
            storeFile file("${rootProject.projectDir}/keys/luxeglow-release.keystore")
            storePassword System.getenv('KEYSTORE_PASSWORD') ?: ''
            keyAlias 'luxeglow'
            keyPassword System.getenv('KEY_PASSWORD') ?: ''
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lintOptions {
        checkReleaseBuilds false
    }
}

repositories {

}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    // Import the Firebase BoM
    implementation platform('com.google.firebase:firebase-bom:34.17.0')

    // Firebase products used by the app
    implementation 'com.google.firebase:firebase-analytics'
}
