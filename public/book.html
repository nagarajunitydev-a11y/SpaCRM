<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0f0a12">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="Book an appointment online — no account required.">
    <title>Book an Appointment</title>

    <link rel="icon" href="/icons/icon-192.png" type="image/png">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">

    <!-- Same production static CSS build the main app uses. -->
    <link rel="stylesheet" href="/styles/tailwind.css">
    <script src="/vendor/lucide.min.js" onerror="this.onerror=null;this.src='https://unpkg.com/lucide@1.31.0/dist/umd/lucide.min.js'"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles/main.css">

    <!-- Identical production Firebase wiring to index.html — this page must
         resolve the SAME salon-scoped backend the CRM writes to. Kept as an
         inline duplicate (not a shared include) because this is a static,
         no-build-step site; see main.js's own copy of this block for the
         canonical version. Local development keeps the demo-mode fallback
         (no config injected) so this page is testable without credentials. -->
    <script>
        (function () {
            if (typeof window.__firebase_config !== 'undefined') return;
            var host = window.location.hostname || '';
            var isLocal = host === 'localhost' || host === '127.0.0.1' || host === '';
            if (isLocal) return;
            window.__firebase_config = JSON.stringify({
                apiKey: 'AIzaSyAQ8LY9AWyVyfMbxOMGxoNSvjEqgXXu-eM',
                authDomain: 'spacrm-two.vercel.app',
                projectId: 'crmapp-1299dddb',
                storageBucket: 'crmapp-1299dddb.firebasestorage.app',
                messagingSenderId: '886981548742',
                appId: '1:886981548742:web:a6686177a005ac42f415c7'
            });
        })();
    </script>
    <script src="/js/firebase-config.dev.js" defer></script>
</head>
<body class="h-full bg-slate-900 text-slate-100 font-sans antialiased selection:bg-brand-500 selection:text-white">

    <div id="app" class="app-shell h-full flex flex-col w-full max-w-md mx-auto bg-slate-950 shadow-2xl overflow-hidden relative border-x border-slate-800" aria-live="polite">
        <!-- Dynamic booking wizard -->
    </div>

    <noscript>
        <div class="fixed inset-0 z-[999] bg-slate-950 text-slate-100 flex items-center justify-center p-6 text-center">
            <p class="text-sm font-semibold">This booking page requires JavaScript. Please enable JavaScript and reload.</p>
        </div>
    </noscript>

    <!-- No service worker here on purpose: booking availability is
         time-sensitive and must always be read live, never served stale. -->
    <script type="module" src="/js/public-booking/publicBookingApp.js"></script>
</body>
</html>
