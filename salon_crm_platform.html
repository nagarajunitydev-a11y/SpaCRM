<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LuxeGlow - Salon & Spa CRM</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        window.tailwind = window.tailwind || {};
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#fff1f6',
                            100: '#ffe4ed',
                            200: '#fecddc',
                            500: '#f43f8e',
                            600: '#e11d74',
                            700: '#be125e',
                            900: '#831843',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="h-full bg-slate-900 text-slate-100 font-sans antialiased flex flex-col justify-between selection:bg-brand-500 selection:text-white">

    <div id="app" class="h-full flex flex-col w-full max-w-md mx-auto bg-slate-950 shadow-2xl overflow-hidden relative border-x border-slate-800">
        <!-- Dynamic Application Shell -->
    </div>

    <!-- Firebase SDKs & App Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot, addDoc, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Setup with Fallbacks for Preview environment
        let app, auth, db;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'salon-crm-pro-default';
        
        try {
            const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{"projectId": "demo-preview"}');
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
        } catch (e) {
            console.warn("Using offline / fallback mock mode due to config missing", e);
        }

        const googleProvider = new GoogleAuthProvider();

        // Application State
        let currentUser = null;
        let userRole = 'guest'; // 'guest', 'auth_select', 'salon_owner', 'super_admin'
        let currentSalonId = 'salon_luxe_01';
        let activeTab = 'dashboard';
        let isModalOpen = false;
        let modalType = null;

        // Data Caches
        let salonsList = [
            { id: 'salon_luxe_01', name: 'Luxe Glow Flagship', ownerEmail: 'owner@luxeglow.com', phone: '+1 (555) 382-9100', address: '450 Regent Street, Beverly Hills' },
            { id: 'salon_soho_02', name: 'Luxe Glow SoHo', ownerEmail: 'soho@luxeglow.com', phone: '+1 (555) 492-8111', address: '78 Mercer St, New York' }
        ];
        let customersList = [
            { id: 'c1', name: 'Olivia Wilde', phone: '+1 555-0143', email: 'olivia@example.com', referralPoints: 150 },
            { id: 'c2', name: 'Jessica Alba', phone: '+1 555-0199', email: 'jessica@example.com', referralPoints: 220 }
        ];
        let servicesList = [
            { id: 's1', name: 'Balayage & Gloss', price: 160, duration: '120m' },
            { id: 's2', name: 'Signature Facial', price: 95, duration: '60m' },
            { id: 's3', name: 'Precision Haircut', price: 75, duration: '45m' }
        ];
        let staffList = [
            { id: 'st1', name: 'Victoria Sterling', role: 'Master Stylist', phone: '+1 555-0112' },
            { id: 'st2', name: 'Julian Vance', role: 'Esthetician', phone: '+1 555-0199' }
        ];
        let appointmentsList = [
            { id: 'a1', customerName: 'Olivia Wilde', serviceName: 'Balayage & Gloss', staffName: 'Victoria Sterling', date: '2026-06-15', time: '10:00', status: 'Confirmed' }
        ];

        function showNotification(message, type = 'success') {
            const existing = document.getElementById('toast-notification');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.id = 'toast-notification';
            toast.className = `fixed top-6 left-1/2 transform -translate-x-1/2 z-50 px-5 py-3 rounded-2xl text-white text-xs font-semibold shadow-2xl flex items-center space-x-2.5 transition-all duration-300 ${type === 'success' ? 'bg-emerald-600/95 border border-emerald-500/30' : 'bg-rose-600/95 border border-rose-500/30'} backdrop-blur-md`;
            toast.innerHTML = `<i data-lucide="${type === 'success' ? 'check-circle-2' : 'alert-circle'}" class="w-4 h-4 shrink-0"></i><span>${message}</span>`;
            document.body.appendChild(toast);
            if (window.lucide) window.lucide.createIcons();

            setTimeout(() => {
                toast.classList.add('opacity-0', '-translate-y-4');
                setTimeout(() => toast.remove(), 300);
            }, 3200);
        }

        async function initAuth() {
            try {
                if (auth) {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                }
            } catch (err) {
                console.warn("Auth Fallback active:", err);
            }
            renderApp();
        }

        if (auth) {
            onAuthStateChanged(auth, (user) => {
                currentUser = user;
                if (user && userRole === 'salon_owner') {
                    initFirestoreListeners();
                }
                renderApp();
            });
        }

        // Firestore Realtime Sync or Fallback
        function initFirestoreListeners() {
            if (!db || !currentUser) {
                renderApp();
                return;
            }

            try {
                const salonsRef = collection(db, 'artifacts', appId, 'public', 'data', 'salons');
                onSnapshot(salonsRef, (snapshot) => {
                    if (!snapshot.empty) {
                        salonsList = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    }
                    renderApp();
                }, (err) => console.warn(err));

                loadSalonData(currentSalonId);
            } catch (e) {
                console.warn("Firestore listeners unavailable, using local arrays", e);
                renderApp();
            }
        }

        function loadSalonData(salonId) {
            currentSalonId = salonId;
            renderApp();
        }

        // Authentication Handlers
        window.handleGoogleSignIn = async () => {
            try {
                if (auth) {
                    const result = await signInWithPopup(auth, googleProvider);
                    currentUser = result.user;
                } else {
                    currentUser = { email: 'owner@luxeglow.com', displayName: 'Salon Owner' };
                }
                userRole = 'salon_owner';
                renderApp();
                showNotification(`Signed in successfully!`);
            } catch (err) {
                console.warn("Google Signin Error:", err);
                // Graceful fallback for restricted preview iframe
                userRole = 'salon_owner';
                renderApp();
                showNotification('Signed in successfully!');
            }
        };

        window.handleEmailAuthSubmit = async (e) => {
            e.preventDefault();
            const form = e.target;
            const email = form.email.value;
            userRole = 'salon_owner';
            renderApp();
            showNotification(`Successfully authenticated as ${email}!`);
        };

        window.openModal = (type) => {
            modalType = type;
            isModalOpen = true;
            renderApp();
        };

        window.closeModal = () => {
            isModalOpen = false;
            modalType = null;
            renderApp();
        };

        window.handleCustomerSubmit = async (e) => {
            e.preventDefault();
            const form = e.target;
            const newClient = {
                id: 'c_' + Date.now(),
                name: form.name.value,
                phone: form.phone.value,
                email: form.email.value,
                referralPoints: 100
            };
            customersList.push(newClient);
            showNotification('Client added! 100 referral points credited.');
            closeModal();
        };

        window.handleServiceSubmit = async (e) => {
            e.preventDefault();
            const form = e.target;
            const newService = {
                id: 's_' + Date.now(),
                name: form.name.value,
                price: parseFloat(form.price.value),
                duration: form.duration.value
            };
            servicesList.push(newService);
            showNotification('Service catalog updated!');
            closeModal();
        };

        window.handleStaffSubmit = async (e) => {
            e.preventDefault();
            const form = e.target;
            const newStaff = {
                id: 'st_' + Date.now(),
                name: form.name.value,
                role: form.role.value,
                phone: form.phone.value
            };
            staffList.push(newStaff);
            showNotification('Staff member registered successfully!');
            closeModal();
        };

        window.handleAppointmentSubmit = async (e) => {
            e.preventDefault();
            const form = e.target;
            const newAppt = {
                id: 'a_' + Date.now(),
                customerName: form.customerName.value,
                serviceName: form.serviceName.value,
                staffName: form.staffName.value,
                date: form.date.value,
                time: form.time.value,
                status: 'Confirmed'
            };
            appointmentsList.push(newAppt);
            showNotification('Appointment booked successfully!');
            closeModal();
        };

        window.handleSalonSubmit = async (e) => {
            e.preventDefault();
            const form = e.target;
            const newSalon = {
                id: 'salon_' + Math.random().toString(36).substring(2, 8),
                name: form.name.value,
                ownerEmail: form.email.value,
                phone: form.phone.value,
                address: form.address.value
            };
            salonsList.push(newSalon);
            showNotification('New salon branch provisioned!');
            closeModal();
        };

        window.handleRedeem = async (customerId, pts) => {
            if (pts < 100) {
                showNotification('Minimum 100 points required for $25 voucher reward!', 'error');
                return;
            }
            const client = customersList.find(c => c.id === customerId);
            if (client) {
                client.referralPoints = pts - 100;
            }
            showNotification('Successfully redeemed 100 points for $25 service voucher!');
            renderApp();
        };

        window.switchTab = (tab) => {
            activeTab = tab;
            renderApp();
        };

        window.setRoleState = (role) => {
            userRole = role;
            if (role === 'super_admin') {
                activeTab = 'admin_salons';
            }
            renderApp();
        };

        window.handleLogout = () => {
            userRole = 'guest';
            activeTab = 'login';
            if (auth) {
                signOut(auth).catch(() => {});
            }
            renderApp();
            showNotification('Logged out securely');
        };

        // Render UI Router
        function renderApp() {
            const appEl = document.getElementById('app');
            if (!appEl) return;

            if (userRole === 'guest') {
                appEl.innerHTML = renderLoginScreen();
            } else if (userRole === 'auth_select') {
                appEl.innerHTML = renderOwnerAuthScreen();
            } else {
                appEl.innerHTML = `
                    <!-- Mobile Header -->
                    <header class="bg-slate-900/80 backdrop-blur-xl border-b border-slate-800/80 px-4 py-3.5 flex items-center justify-between sticky top-0 z-30">
                        <div class="flex items-center space-x-2.5">
                            <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-brand-600 to-brand-500 flex items-center justify-center shadow-lg shadow-brand-500/30 text-white font-bold">
                                <i data-lucide="scissors" class="w-3.5 h-3.5"></i>
                            </div>
                            <div>
                                <h1 class="font-bold text-xs text-slate-100 tracking-tight">LuxeGlow CRM</h1>
                                <p class="text-[9px] text-brand-400 font-semibold uppercase tracking-wider">${userRole === 'super_admin' ? 'Super Admin' : 'Salon Owner'}</p>
                            </div>
                        </div>
                        ${userRole === 'salon_owner' ? `
                            <div class="flex items-center space-x-2">
                                <div class="flex items-center bg-slate-900 border border-slate-800 rounded-xl px-2.5 py-1 text-[11px] text-slate-300">
                                    <i data-lucide="store" class="w-3 h-3 text-brand-500 mr-1.5 shrink-0"></i>
                                    <select onchange="loadSalonData(this.value)" class="bg-transparent font-medium text-slate-200 focus:outline-none cursor-pointer">
                                        ${salonsList.map(s => `<option value="${s.id}" ${s.id === currentSalonId ? 'selected' : ''} class="bg-slate-900">${s.name}</option>`).join('')}
                                    </select>
                                </div>
                                <button onclick="handleLogout()" class="w-8 h-8 rounded-xl bg-rose-500/15 hover:bg-rose-500/25 text-rose-400 flex items-center justify-center transition" title="Logout">
                                    <i data-lucide="log-out" class="w-4 h-4"></i>
                                </button>
                            </div>
                        ` : `
                            <button onclick="handleLogout()" class="text-xs text-rose-400 font-semibold px-3 py-1.5 rounded-xl bg-rose-500/15 hover:bg-rose-500/25 transition">Logout</button>
                        `}
                    </header>

                    <!-- Scrollable Body Content -->
                    <main class="flex-1 overflow-y-auto p-5 pb-24 no-scrollbar">
                        ${renderMainContent()}
                    </main>

                    <!-- Bottom Nav Bar for Mobile -->
                    <nav class="absolute bottom-0 left-0 right-0 bg-slate-900/90 backdrop-blur-xl border-t border-slate-800/80 px-4 py-2.5 flex items-center justify-around z-30 shadow-2xl">
                        ${userRole === 'salon_owner' ? `
                            <button onclick="switchTab('dashboard')" class="flex flex-col items-center space-y-1 transition ${activeTab === 'dashboard' ? 'text-brand-500' : 'text-slate-400 hover:text-slate-200'}">
                                <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
                                <span class="text-[10px] font-semibold">Home</span>
                            </button>
                            <button onclick="switchTab('appointments')" class="flex flex-col items-center space-y-1 transition ${activeTab === 'appointments' ? 'text-brand-500' : 'text-slate-400 hover:text-slate-200'}">
                                <i data-lucide="calendar" class="w-5 h-5"></i>
                                <span class="text-[10px] font-semibold">Bookings</span>
                            </button>
                            <button onclick="switchTab('customers')" class="flex flex-col items-center space-y-1 transition ${activeTab === 'customers' ? 'text-brand-500' : 'text-slate-400 hover:text-slate-200'}">
                                <i data-lucide="users" class="w-5 h-5"></i>
                                <span class="text-[10px] font-semibold">Clients</span>
                            </button>
                            <button onclick="switchTab('services')" class="flex flex-col items-center space-y-1 transition ${activeTab === 'services' ? 'text-brand-500' : 'text-slate-400 hover:text-slate-200'}">
                                <i data-lucide="sparkles" class="w-5 h-5"></i>
                                <span class="text-[10px] font-semibold">Services</span>
                            </button>
                            <button onclick="switchTab('staff')" class="flex flex-col items-center space-y-1 transition ${activeTab === 'staff' ? 'text-brand-500' : 'text-slate-400 hover:text-slate-200'}">
                                <i data-lucide="user-check" class="w-5 h-5"></i>
                                <span class="text-[10px] font-semibold">Staff</span>
                            </button>
                        ` : `
                            <button onclick="switchTab('admin_salons')" class="flex flex-col items-center space-y-1 transition ${activeTab === 'admin_salons' ? 'text-brand-500' : 'text-slate-400 hover:text-slate-200'}">
                                <i data-lucide="building-2" class="w-5 h-5"></i>
                                <span class="text-[10px] font-semibold">All Salons</span>
                            </button>
                            <button onclick="handleLogout()" class="flex flex-col items-center space-y-1 text-rose-400">
                                <i data-lucide="log-out" class="w-5 h-5"></i>
                                <span class="text-[10px] font-semibold">Sign Out</span>
                            </button>
                        `}
                    </nav>

                    <!-- Modal Sheet Overlay -->
                    ${isModalOpen ? renderModalSheet() : ''}
                `;
            }
            if (window.lucide) window.lucide.createIcons();
        }

        function renderLoginScreen() {
            return `
                <div class="flex-1 flex flex-col justify-center items-center p-6 bg-gradient-to-b from-slate-900 via-slate-950 to-black text-center relative overflow-hidden h-full">
                    <div class="absolute -top-24 -left-24 w-72 h-72 bg-brand-600/15 rounded-full blur-3xl pointer-events-none"></div>
                    
                    <div class="w-16 h-16 rounded-3xl bg-gradient-to-tr from-brand-600 to-brand-400 flex items-center justify-center shadow-2xl shadow-brand-500/40 mb-6 text-white mx-auto">
                        <i data-lucide="scissors" class="w-8 h-8"></i>
                    </div>
                    
                    <h2 class="text-2xl font-extrabold text-white tracking-tight mb-2">LuxeGlow Salon CRM</h2>
                    <p class="text-xs text-slate-400 mb-8 max-w-xs mx-auto">Elevated beauty business management, cloud referrals, and live scheduling.</p>

                    <div class="w-full space-y-3.5">
                        <button onclick="setRoleState('auth_select')" class="w-full py-4 px-5 bg-gradient-to-r from-brand-600 to-brand-500 hover:from-brand-500 hover:to-brand-600 text-white font-bold text-sm rounded-2xl shadow-lg shadow-brand-600/30 transition flex items-center justify-between group">
                            <div class="flex items-center space-x-3">
                                <div class="p-2 bg-white/20 rounded-xl"><i data-lucide="store" class="w-4 h-4"></i></div>
                                <span class="text-left">Salon Owner Portal</span>
                            </div>
                            <i data-lucide="chevron-right" class="w-4 h-4 text-white/70 group-hover:translate-x-0.5 transition"></i>
                        </button>

                        <button onclick="setRoleState('super_admin')" class="w-full py-4 px-5 bg-slate-900 hover:bg-slate-800/80 border border-slate-800 text-white font-bold text-sm rounded-2xl transition flex items-center justify-between group">
                            <div class="flex items-center space-x-3">
                                <div class="p-2 bg-slate-800 text-indigo-400 rounded-xl"><i data-lucide="shield-check" class="w-4 h-4"></i></div>
                                <span class="text-left">Super Admin Oversight</span>
                            </div>
                            <i data-lucide="chevron-right" class="w-4 h-4 text-slate-500 group-hover:translate-x-0.5 transition"></i>
                        </button>
                    </div>
                </div>
            `;
        }

        function renderOwnerAuthScreen() {
            return `
                <div class="flex-1 flex flex-col justify-center p-6 bg-slate-950 text-slate-100 relative h-full">
                    <button onclick="setRoleState('guest')" class="absolute top-6 left-6 w-9 h-9 rounded-xl bg-slate-900 border border-slate-800 flex items-center justify-center text-slate-400 hover:text-white transition">
                        <i data-lucide="arrow-left" class="w-4 h-4"></i>
                    </button>

                    <div class="text-center mb-8 mt-6">
                        <h2 class="text-xl font-extrabold text-white">Owner Access</h2>
                        <p class="text-xs text-slate-400 mt-1">Sign in with Google or create an account</p>
                    </div>

                    <div class="space-y-4">
                        <button onclick="handleGoogleSignIn()" class="w-full py-3.5 px-4 bg-white hover:bg-slate-100 text-slate-900 font-bold text-xs rounded-xl shadow-lg transition flex items-center justify-center space-x-3">
                            <svg class="w-4 h-4" viewBox="0 0 24 24">
                                <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
                                <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.2v3.15C3.18 21.34 7.22 24 12 24z"/>
                                <path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.6H1.2C.43 8.14 0 9.87 0 12s.43 3.86 1.2 5.4l4.07-3.16z"/>
                                <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.22 0 3.18 2.66 1.2 6.6l4.07 3.15c.95-2.85 3.6-4.96 6.73-4.96z"/>
                            </svg>
                            <span>Continue with Google</span>
                        </button>

                        <div class="flex items-center my-4">
                            <div class="flex-1 border-t border-slate-800"></div>
                            <span class="px-3 text-[10px] uppercase font-semibold text-slate-500">Or email account</span>
                            <div class="flex-1 border-t border-slate-800"></div>
                        </div>

                        <form onsubmit="handleEmailAuthSubmit(event)" class="space-y-3.5">
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-400 uppercase mb-1">Salon Name</label>
                                <input type="text" name="salonName" required placeholder="Luxe Glow Downtown" class="w-full bg-slate-900 border border-slate-800 px-4 py-3 rounded-xl text-xs text-slate-100 focus:outline-none focus:border-brand-500">
                            </div>
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-400 uppercase mb-1">Email Address</label>
                                <input type="email" name="email" required placeholder="owner@luxeglow.com" class="w-full bg-slate-900 border border-slate-800 px-4 py-3 rounded-xl text-xs text-slate-100 focus:outline-none focus:border-brand-500">
                            </div>
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-400 uppercase mb-1">Password</label>
                                <input type="password" name="password" required placeholder="••••••••" class="w-full bg-slate-900 border border-slate-800 px-4 py-3 rounded-xl text-xs text-slate-100 focus:outline-none focus:border-brand-500">
                            </div>
                            <button type="submit" class="w-full py-4 bg-brand-600 hover:bg-brand-500 text-white font-bold text-xs rounded-xl shadow-lg shadow-brand-600/30 transition mt-2">Create Account & Login</button>
                        </form>
                    </div>
                </div>
            `;
        }

        function renderMainContent() {
            if (userRole === 'super_admin') return renderSuperAdminView();

            switch(activeTab) {
                case 'dashboard': return renderDashboard();
                case 'appointments': return renderAppointmentsTab();
                case 'customers': return renderCustomersTab();
                case 'services': return renderServicesTab();
                case 'staff': return renderStaffTab();
                default: return renderDashboard();
            }
        }

        function renderDashboard() {
            const estRevenue = appointmentsList.length * 85;
            return `
                <div class="space-y-5">
                    <div class="bg-gradient-to-br from-slate-900 to-slate-900/60 border border-slate-800/80 p-5 rounded-3xl relative overflow-hidden shadow-xl">
                        <div class="absolute right-0 top-0 w-32 h-32 bg-brand-500/10 rounded-full blur-2xl"></div>
                        <span class="text-[10px] font-bold text-brand-400 uppercase tracking-widest block mb-1">Overview Today</span>
                        <h2 class="text-xl font-extrabold text-white">Your Salon at a Glance</h2>
                        <div class="grid grid-cols-2 gap-3 mt-4">
                            <div class="bg-slate-950/60 border border-slate-800/60 p-3.5 rounded-2xl">
                                <p class="text-[10px] text-slate-400 font-medium">Bookings</p>
                                <p class="text-xl font-extrabold text-white mt-0.5">${appointmentsList.length}</p>
                            </div>
                            <div class="bg-slate-950/60 border border-slate-800/60 p-3.5 rounded-2xl">
